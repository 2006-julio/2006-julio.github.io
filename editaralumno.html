<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Editar alumno</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<div class="contenedor">

<!-- ENCABEZADO -->

<header class="encabezado">

    <h1>Editar alumno</h1>

    <p>
        Modificar los datos registrados del estudiante
    </p>

</header>


<!-- BUSCADOR -->

<section class="tarjeta">

    <h2>Buscar alumno</h2>

    <p class="texto-ayuda">
        Ingresa el ID del alumno para cargar sus datos.
    </p>


    <div class="busqueda-edicion">

        <input
            type="text"
            id="idBuscar"
            placeholder="Ejemplo: X7kP2mQa9Lw..."
        >

        <button
            class="boton-principal boton-buscar"
            id="btnBuscar"
        >
            Buscar alumno
        </button>

    </div>


    <p id="mensaje"></p>

</section>


<!-- FORMULARIO DE EDICIÓN -->

<section
    class="tarjeta"
    id="seccionEditar"
    style="display: none;"
>

    <div class="cabecera-edicion">

        <div>

            <h2>Datos del alumno</h2>

            <p>
                ID del alumno:
                <strong
                    class="id"
                    id="idAlumno"
                ></strong>
            </p>

        </div>

    </div>


    <div class="formulario">


        <!-- NOMBRE -->

        <div class="campo">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
            >

        </div>


        <!-- APELLIDO -->

        <div class="campo">

            <label for="apellido">
                Apellido
            </label>

            <input
                type="text"
                id="apellido"
            >

        </div>


        <!-- GRADO -->

        <div class="campo">

            <label for="grado">
                Grado
            </label>

            <select id="grado">

                <option value="">
                    Seleccionar grado
                </option>

                <option value="1ro">
                    1ro
                </option>

                <option value="2do">
                    2do
                </option>

                <option value="3ro">
                    3ro
                </option>

                <option value="4to">
                    4to
                </option>

                <option value="5to">
                    5to
                </option>

            </select>

        </div>


        <!-- SECCIÓN -->

        <div class="campo">

            <label for="seccion">
                Sección
            </label>

            <select id="seccion">

                <option value="">
                    Seleccionar sección
                </option>

                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="J">J</option>

            </select>

        </div>


        <!-- TELÉFONO -->

        <div class="campo">

            <label for="telefono">

                Número de padre, madre
                o apoderado

                <span>
                    (opcional)
                </span>

            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="Ejemplo: 987654321"
                maxlength="9"
            >

        </div>


    </div>


    <!-- BOTONES -->

    <div class="botones-edicion">

        <button
            class="boton-principal"
            id="btnGuardar"
        >
            Guardar cambios
        </button>


        <button
            class="boton-secundario"
            id="btnCancelar"
        >
            Cancelar
        </button>

    </div>


</section>


<!-- RESULTADO -->

<section
    class="tarjeta resultado"
    id="resultado"
>

    <h2>Datos actualizados</h2>

    <p>
        Los datos del alumno fueron actualizados correctamente.
    </p>

    <div class="datos-actualizados">

        <p>
            <strong>Nombre:</strong>
            <span id="resultadoNombre"></span>
        </p>

        <p>
            <strong>Apellido:</strong>
            <span id="resultadoApellido"></span>
        </p>

        <p>
            <strong>Grado:</strong>
            <span id="resultadoGrado"></span>
        </p>

        <p>
            <strong>Sección:</strong>
            <span id="resultadoSeccion"></span>
        </p>

        <p>
            <strong>Apoderado:</strong>
            <span id="resultadoTelefono"></span>
        </p>

        <p>
            <strong>ID:</strong>

            <span
                class="id"
                id="resultadoId"
            ></span>

        </p>

    </div>

</section>

</div>

<script
    type="module"
    src="./editaralumno.js"
></script>

</body>

</html>
